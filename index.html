<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electrical Takeoff Workflow Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --border-color: #334155;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 2rem; }
    .app-container { max-width: 1400px; margin: 0 auto; }

    /* Top Navigation / Dashboard Header */
    header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .brand { display: flex; align-items: center; gap: 1rem; }
    .brand-icon { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; padding: 0.8rem 1rem; border-radius: 12px; font-size: 1.25rem; }
    .brand-text h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand-text p { color: var(--text-muted); font-size: 0.85rem; }

    .header-actions { display: flex; gap: 1rem; align-items: center; }
    .project-input-group { display: flex; gap: 0.5rem; background: var(--bg-main); padding: 0.35rem; border-radius: 10px; border: 1px solid var(--border-color); }
    input[type="text"], select {
      background: transparent; border: none; color: var(--text-main); padding: 0.5rem 0.75rem; font-size: 0.9rem; outline: none;
    }
    select { border-left: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; }
    select option { background: var(--bg-card); color: var(--text-main); }
    
    .btn {
      background: var(--accent-blue); color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Progress Overview Section */
    .dashboard-summary {
      display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;
    }
    .summary-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: center;
    }
    .progress-bar-container { margin-top: 1rem; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 600; }
    .progress-track { background: var(--bg-main); height: 10px; border-radius: 5px; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #38bdf8, #22c55e); height: 100%; width: 0%; transition: width 0.4s ease; }

    .stat-number { font-size: 1.8rem; font-weight: 700; color: var(--accent-blue); margin-top: 0.25rem; }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

    /* Workflow Cards Grid */
    .workflow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1.5rem; }
    .phase-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column;
    }
    .phase-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
    .phase-tag { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .phase-title { font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }

    .task-list { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
    .task-item {
      display: flex; align-items: flex-start; gap: 0.75rem; background: rgba(15, 23, 42, 0.4); padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid transparent; transition: all 0.2s ease;
    }
    .task-item:hover { border-color: var(--border-color); background: var(--bg-card-hover); }
    .task-item.nested { margin-left: 1.5rem; border-left: 2px solid var(--border-color); border-radius: 0 10px 10px 0; }
    
    input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent-blue); cursor: pointer; }
    label { font-size: 0.875rem; line-height: 1.4; color: var(--text-main); cursor: pointer; flex: 1; }
    .task-item.completed { opacity: 0.5; }
    .task-item.completed label { text-decoration: line-through; }

    .status-toast {
      position: fixed; bottom: 2rem; right: 2rem; background: var(--accent-green); color: #0f172a; padding: 0.8rem 1.25rem; border-radius: 10px; font-weight: 700; font-size: 0.875rem; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.4); animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
      <div class="brand-text">
        <h1>Electrical Takeoff Manager</h1>
        <p>Enterprise Estimating & Workflow Tracker</p>
      </div>
    </div>
    
    <div class="header-actions">
      <div class="project-input-group">
        <input type="text" id="project-name" placeholder="Project Name / Ref No..." />
        <select id="project-selector" onchange="loadSelectedProject()">
          <option value="">-- Load Cloud File --</option>
        </select>
      </div>
      <button class="btn" id="save-btn" onclick="saveToCloud()">
        <i class="fa-solid fa-cloud-arrow-up"></i> Save
      </button>
    </div>
  </header>

  <div class="dashboard-summary">
    <div class="summary-card">
      <div class="progress-info">
        <span style="color: var(--text-muted);">Overall Completion</span>
        <span id="progress-percent" style="color: var(--accent-blue);">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>
    <div class="summary-card">
      <div class="stat-label">Tasks Finished</div>
      <div class="stat-number" id="completed-count">0 / 22</div>
    </div>
    <div class="summary-card">
      <div class="stat-label">Cloud Status</div>
      <div class="stat-number" style="font-size: 1.2rem; color: var(--accent-green); margin-top: 0.6rem;">
        <i class="fa-solid fa-circle-check"></i> Connected
      </div>
    </div>
  </div>

  <div class="workflow-grid">
    <!-- Phase 1 -->
    <div class="phase-card">
      <div class="phase-header">
        <div>
          <span class="phase-tag">Phase 1</span>
          <div class="phase-title">Tender Intake & Setup</div>
        </div>
        <i class="fa-solid fa-folder-open" style="color: var(--text-muted);"></i>
      </div>
      <ul class="task-list">
        <li class="task-item"><input type="checkbox" id="t1" onchange="updateProgress()"><label for="t1"><strong>Step 1:</strong> Receive tender via Email or Estimate One.</label></li>
        <li class="task-item"><input type="checkbox" id="t2" onchange="updateProgress()"><label for="t2"><strong>Step 2:</strong> Check file completeness (Drawings, specs, schedules).</label></li>
        <li class="task-item"><input type="checkbox" id="t3" onchange="updateProgress()"><label for="t3"><strong>Step 3:</strong> Set up directory structure (01 Tender, 02 Subbie, 03 Docs, 04 Corro, 05 Working).</label></li>
        <li class="task-item"><input type="checkbox" id="t4" onchange="updateProgress()"><label for="t4"><strong>Step 4:</strong> Save documentation and key plans.</label></li>
      </ul>
    </div>

    <!-- Phase 2 -->
    <div class="phase-card">
      <div class="phase-header">
        <div>
          <span class="phase-tag">Phase 2</span>
          <div class="phase-title">Scoping & Review</div>
        </div>
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
      </div>
      <ul class="task-list">
        <li class="task-item"><input type="checkbox" id="t5" onchange="updateProgress()"><label for="t5"><strong>Step 5:</strong> Identify project classification & type.</label></li>
        <li class="task-item"><input type="checkbox" id="t6" onchange="updateProgress()"><label for="t6"><strong>Step 6:</strong> Review drawings, scope notes & spec details.</label></li>
        <li class="task-item"><input type="checkbox" id="t7" onchange="updateProgress()"><label for="t7"><strong>Step 7:</strong> Run Master Checklist sweep (Lighting, Power, MSB, Security, Fire, PV).</label></li>
        <li class="task-item"><input type="checkbox" id="t8" onchange="updateProgress()"><label for="t8"><strong>Step 8:</strong> Prepare & send specialist sub-tier RFQs.</label></li>
      </ul>
    </div>

    <!-- Phase 3 -->
    <div class="phase-card">
      <div class="phase-header">
        <div>
          <span class="phase-tag">Phase 3</span>
          <div class="phase-title">Takeoff Execution</div>
        </div>
        <i class="fa-solid fa-ruler-combined" style="color: var(--text-muted);"></i>
      </div>
      <ul class="task-list">
        <li class="task-item"><input type="checkbox" id="t9" onchange="updateProgress()"><label for="t9"><strong>Step 9:</strong> Calibrate plan scales (Check door baseline ~0.92m).</label></li>
        <li class="task-item"><input type="checkbox" id="t10_head" onchange="updateProgress()"><label for="t10_head"><strong>Step 10: System Quantities Takeoff</strong></label></li>
        <li class="task-item nested"><input type="checkbox" id="t10_1" onchange="updateProgress()"><label for="t10_1">1. Lighting & Emergency (RFQ High Priority)</label></li>
        <li class="task-item nested"><input type="checkbox" id="t10_2" onchange="updateProgress()"><label for="t10_2">2. Power, Isolators & Distribution</label></li>
        <li class="task-item nested"><input type="checkbox" id="t10_3" onchange="updateProgress()"><label for="t10_3">3. Communications & Cat6A Cabling</label></li>
        <li class="task-item nested"><input type="checkbox" id="t10_4" onchange="updateProgress()"><label for="t10_4">4. Containment (Tray & Conduits)</label></li>
        <li class="task-item nested"><input type="checkbox" id="t10_5" onchange="updateProgress()"><label for="t10_5">5. Mains & Submains Feeder Runs</label></li>
        <li class="task-item nested"><input type="checkbox" id="t10_6" onchange="updateProgress()"><label for="t10_6">6. AV, Security & Fire Alarm Systems</label></li>
        <li class="task-item"><input type="checkbox" id="t11" onchange="updateProgress()"><label for="t11"><strong>Step 11:</strong> Post-takeoff QA cross-check.</label></li>
        <li class="task-item"><input type="checkbox" id="t12" onchange="updateProgress()"><label for="t12"><strong>Step 12:</strong> Finalize BOQ export & Bill of Materials.</label></li>
      </ul>
    </div>
  </div>
</div>

<div id="status-toast" class="status-toast">
  <i class="fa-solid fa-circle-check"></i> Changes Saved to Cloud
</div>

<script>
  const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbzl61bAq7IsFCL8vqT4M5sUNoY95SLhsZcJJFEYy6YdsCKOmnXTS62CIptb4S4bihaCpQ/exec";
  let projectsCache = [];

  function updateProgress() {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    let checkedCount = 0;

    checkboxes.forEach(box => {
      const parent = box.parentElement;
      if (box.checked) {
        checkedCount++;
        parent.classList.add('completed');
      } else {
        parent.classList.remove('completed');
      }
    });

    const total = checkboxes.length;
    const percent = Math.round((checkedCount / total) * 100);
    
    document.getElementById('progress-fill').style.width = percent + '%';
    document.getElementById('progress-percent').textContent = percent + '%';
    document.getElementById('completed-count').textContent = `${checkedCount} / ${total}`;
  }

  function showToast(text) {
    const toast = document.getElementById('status-toast');
    toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${text}`;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
  }

  async function saveToCloud() {
    const projectName = document.getElementById('project-name').value.trim();
    if (!projectName) return alert('Please enter a project name.');

    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;

    const tasks = {};
    document.querySelectorAll('input[type="checkbox"]').forEach(box => {
      tasks[box.id] = box.checked;
    });

    try {
      await fetch(GOOGLE_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectName, tasks })
      });

      showToast("Saved to Google Sheets!");
      setTimeout(fetchProjectsFromCloud, 1000);
    } catch (err) {
      alert("Error saving data.");
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Save`;
    }
  }

  async function fetchProjectsFromCloud() {
    if (!GOOGLE_API_URL || GOOGLE_API_URL.includes("YOUR_GOOGLE")) return;

    try {
      const res = await fetch(GOOGLE_API_URL);
      projectsCache = await res.json();

      const selector = document.getElementById('project-selector');
      selector.innerHTML = '<option value="">-- Load Cloud File --</option>';

      projectsCache.forEach(p => {
        const option = document.createElement('option');
        option.value = p.projectName;
        option.textContent = p.projectName;
        selector.appendChild(option);
      });
    } catch (err) {
      console.error(err);
    }
  }

  function loadSelectedProject() {
    const selectedName = document.getElementById('project-selector').value;
    if (!selectedName) return;

    const project = projectsCache.find(p => p.projectName === selectedName);
    if (project) {
      document.getElementById('project-name').value = project.projectName;
      document.querySelectorAll('input[type="checkbox"]').forEach(box => {
        box.checked = !!project.tasks[box.id];
      });
      updateProgress();
      showToast(`Loaded "${project.projectName}"`);
    }
  }

  fetchProjectsFromCloud();
</script>

</body>
</html>
